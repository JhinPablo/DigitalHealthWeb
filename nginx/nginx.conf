events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Rendimiento ───────────────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Compresión Gzip ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml
        font/woff font/woff2;

    # ── Rate Limiting ─────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:10m   rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Ocultar versión ───────────────────────────────────────────
    server_tokens off;

    # ── Logs ──────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Tamaño máximo de carga (imágenes médicas) ─────────────────
    client_max_body_size 50M;

    server {
        listen 80;
        server_name 134.122.9.136;

        # ── Headers de seguridad ──────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"                        always;
        add_header X-Content-Type-Options "nosniff"                           always;
        add_header X-XSS-Protection       "1; mode=block"                     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: http: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://134.122.9.136;"
            always;

        # ── Límite de conexiones por IP ───────────────────────────
        limit_conn conn_limit 20;

        # ── FRONTEND SPA ──────────────────────────────────────────
        location / {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── AUTH ──────────────────────────────────────────────────
        location /auth/ {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass         http://backend:8000/auth/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── FHIR (pacientes, observaciones, imágenes) ─────────────
        location /fhir/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass         http://backend:8000/fhir/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_max_body_size 50M;
        }

        # ── ADMIN ─────────────────────────────────────────────────
        location /admin/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://backend:8000/admin/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── INFERENCE (ML/DL) ─────────────────────────────────────
        location /inference/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://backend:8000/inference/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── HEALTH / DOCS ─────────────────────────────────────────
        location = /health {
            proxy_pass http://backend:8000/health;
        }

        location /docs {
            proxy_pass http://backend:8000/docs;
        }

        location /openapi.json {
            proxy_pass http://backend:8000/openapi.json;
        }

        # ── Error 429 (rate limit) ────────────────────────────────
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Demasiadas solicitudes. Intenta en un momento.","code":429}';
        }

        # ── Error 502/503/504 (servicio caído) ────────────────────
        error_page 502 503 504 @gateway_error;
        location @gateway_error {
            default_type application/json;
            return 502 '{"error":"Servicio no disponible temporalmente.","code":502}';
        }
    }
}
